name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate header/footer from template
        run: python3 scripts/build.py

      # Nur die GitHub-Vorschau fuer Suchmaschinen sperren.
      # Die Arbeitskopie und das IONOS-Paket bleiben ohne noindex.
      # Seiten, die schon ein robots-Meta haben, werden uebersprungen.
      - name: Vorschau fuer Suchmaschinen sperren (noindex)
        run: |
          find . -name "*.html" -not -path "./.git/*" -print0 \
            | xargs -0 grep -L 'name="robots"' \
            | xargs -r sed -i 's|<head>|<head>\n<meta name="robots" content="noindex, nofollow">|'
          echo "Seiten mit noindex: $(grep -rl --include=*.html 'name="robots" content="noindex' . | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
